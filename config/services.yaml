services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Rag\SyntheticDocumentLoader:
        arguments:
            $syntheticDir: '%kernel.project_dir%/data/synthetic'

    App\Service\AiAssistant:
        arguments:
            $agent: '@ai.agent.default'